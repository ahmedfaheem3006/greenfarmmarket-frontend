name: Green Farm Market Frontend Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: greenfarmmarket-frontend-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Publish Production Static Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. npm ci
        run: npm ci

      - name: 4. Build Vite Production Frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.greenfarmmarket.com/api' }}
        run: npm run build

      - name: 5. npm test --if-present
        run: npm test --if-present

      - name: 6. Verify dist/index.html exists
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ CRITICAL FAILURE: dist/index.html was not generated by Vite build!"
            exit 1
          fi
          echo "✅ SUCCESS: dist/index.html verified."

      - name: 7. Verify dist/.htaccess exists
        run: |
          if [ ! -f "dist/.htaccess" ]; then
            echo "❌ CRITICAL FAILURE: dist/.htaccess was not copied into build output!"
            exit 1
          fi
          echo "✅ SUCCESS: dist/.htaccess verified."

      - name: 8. Verify dist/assets directory exists
        run: |
          if [ ! -d "dist/assets" ]; then
            echo "❌ CRITICAL FAILURE: dist/assets directory is missing!"
            exit 1
          fi
          echo "✅ SUCCESS: dist/assets directory verified."

      - name: 9. Publish build artifacts to hostinger-production branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd dist

          git init

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b hostinger-production

          git add -A

          git commit -m "deploy: static production build from ${GITHUB_SHA}"

          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:hostinger-production \
            --force

